    <base href="/">

    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.iugna.edu.ar/">

    <!-- Security headers via meta -->
    <!-- X-Frame-Options y frame-ancestors SOLO funcionan como HTTP headers del servidor, no via meta -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com;
               font-src 'self' https://unpkg.com https://cdnjs.cloudflare.com;
               img-src 'self' data: blob: https://servicioiugna.iugna.edu.ar;
               connect-src 'self' https://servicioiugna.iugna.edu.ar https://www.googleapis.com;
               object-src 'none';
               base-uri 'self';">

    <link rel="icon" type="image/x-icon" href="favicon.png">
