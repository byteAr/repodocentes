<app-header></app-header>
<p-breadcrumb class=""  [model]="items"></p-breadcrumb>
<div class="bg-gradient-to-r from-teal-500 to-green-500 py-3 text-white pl-6 md:pl-28">
  <h1 class="subtitulo md:text-[1.5rem]">Oferta Académica</h1>
</div>
<div class="flex">
  <div class="p-6 space-y-6 w-[35%]">
    <div class="w-full rounded-xl border border-gray-200 bg-white">
      <div class="px-4 pb-4 pt-4 text-sm text-gray-700">
        <div class="flex flex-col gap-2" role="group" aria-label="Acciones Buenos Aires">
          <a
            routerLink="./ciclos"
            class="block w-full px-3 py-3 font-medium
                   ring-1 ring-gray-200 hover:bg-gray-50 focus:outline-none text-white
                   focus-visible:ring-2 focus-visible:ring-blue-500 text-left text-[1.1rem]
                   bg-gradient-to-r from-[#598f8f] to-[#b1cb9c]"
          >
            Licenciaturas
          </a>
          <a
            routerLink="./tecnicaturas-escusub"
            class="block w-full px-3 py-3 font-medium
                   ring-1 ring-gray-200 hover:bg-gray-50 focus:outline-none text-white
                   focus-visible:ring-2 focus-visible:ring-blue-500 text-left text-[1.1rem]
                   bg-gradient-to-r from-[#598f8f] to-[#b1cb9c]"
          >
            Tecnicaturas
          </a>
          <a
            routerLink="./diplomaturas"
            class="block w-full px-3 py-3 font-medium
                   ring-1 ring-gray-200 hover:bg-gray-50 focus:outline-none text-white
                   focus-visible:ring-2 focus-visible:ring-blue-500 text-left text-[1.1rem]
                   bg-gradient-to-r from-[#598f8f] to-[#b1cb9c]"
          >
            Diplomaturas
          </a>
          <a
            routerLink="/uuaa/escusuper/extension"
            class="block w-full px-3 py-3 font-medium
                   ring-1 ring-gray-200 hover:bg-gray-50 focus:outline-none text-white
                   focus-visible:ring-2 focus-visible:ring-blue-500 text-left text-[1.1rem]
                   bg-gradient-to-r from-[#598f8f] to-[#b1cb9c]"
          >
            Extensión
          </a>
        </div>
      </div>
    </div>
  </div>
